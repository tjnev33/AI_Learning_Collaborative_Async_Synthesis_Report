<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Learning Collaborative — Secure Access</title>
<meta name="description" content="AI Learning Collaborative — District Next Steps synthesis report. Password required.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Source+Sans+3:wght@300;400;500;600&display=swap');

  :root {
    --ink: #1c1f26;
    --ink-soft: #2e323d;
    --ink-muted: #5c6272;
    --ink-light: #8a8f9e;
    --paper: #faf9f7;
    --white: #ffffff;
    --teal: #1a7a6d;
    --teal-bright: #22a08e;
    --navy: #1e3a5f;
    --navy-deep: #0f2440;
    --rust: #b85430;
    --rust-bg: #fdf0ea;
    --rule-light: #e8e5df;
    --shadow-card: 0 2px 12px rgba(28,31,38,0.06);
    --shadow-lifted: 0 8px 30px rgba(28,31,38,0.12);
    --radius: 6px;
    --font-display: 'Fraunces', 'Georgia', serif;
    --font-body: 'Source Sans 3', 'Segoe UI', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; }
  body {
    font-family: var(--font-body);
    background: linear-gradient(180deg, var(--navy-deep) 0%, var(--navy) 100%);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-card {
    background: var(--white);
    border-radius: 10px;
    box-shadow: var(--shadow-lifted);
    padding: 44px 40px 36px;
    max-width: 440px;
    width: 100%;
  }

  .eyebrow {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .eyebrow .dot {
    width: 6px; height: 6px;
    background: var(--teal-bright);
    border-radius: 50%;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.55rem;
    line-height: 1.22;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 0.96rem;
    color: var(--ink-muted);
    margin-bottom: 28px;
    line-height: 1.55;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  label {
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: -8px;
  }

  input[type="password"] {
    font-family: var(--font-body);
    font-size: 1rem;
    padding: 12px 14px;
    border: 1px solid var(--rule-light);
    border-radius: var(--radius);
    background: var(--paper);
    color: var(--ink);
    transition: border-color 0.2s, background 0.2s;
  }
  input[type="password"]:focus {
    outline: none;
    border-color: var(--teal);
    background: var(--white);
  }

  button {
    font-family: var(--font-body);
    font-size: 0.96rem;
    font-weight: 600;
    background: var(--teal);
    color: var(--white);
    border: none;
    padding: 12px 18px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  button:hover { background: var(--teal-bright); }
  button:active { transform: translateY(1px); }

  .error {
    font-size: 0.86rem;
    color: var(--rust);
    background: var(--rust-bg);
    border: 1px solid rgba(184,84,48,0.18);
    border-radius: var(--radius);
    padding: 10px 14px;
    display: none;
  }
  .error.show { display: block; }

  .footer-note {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--rule-light);
    font-size: 0.78rem;
    color: var(--ink-light);
    text-align: center;
    font-family: var(--font-display);
    font-style: italic;
  }
</style>
</head>
<body>

<div class="login-card" id="login">

  <h1>AI Learning Collaborative</h1>
  <p class="subtitle">District Next Steps synthesis report. Please enter the password to continue.</p>
  <form id="auth-form" onsubmit="checkPassword(event)">
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="off" autofocus required>
    <div class="error" id="error">Incorrect password. Please try again.</div>
    <button type="submit">Unlock report</button>
  </form>
  <div class="footer-note">TJ Neville &amp; Andy Marshall</div>
</div>

async function sha256(text) {
  if (!window.crypto || !window.crypto.subtle) {
    throw new Error('Web Crypto API unavailable. This usually means the file was opened directly (file://) rather than served from a web URL. Try hosting via GitHub Pages or a local server.');
  }
  const buf = new TextEncoder().encode(text);
  const hashBuf = await crypto.subtle.digest('SHA-256', buf);
  const arr = Array.from(new Uint8Array(hashBuf));
  return arr.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function checkPassword(e) {
  e.preventDefault();
  const pw = document.getElementById('pw').value.trim();
  const err = document.getElementById('error');
  try {
    const hash = await sha256(pw);
    if (hash === STORED_HASH) {
      err.classList.remove('show');
      const decoded = atob(PAYLOAD);
      const bytes = new Uint8Array(decoded.length);
      for (let i = 0; i < decoded.length; i++) bytes[i] = decoded.charCodeAt(i);
      const html = new TextDecoder('utf-8').decode(bytes);
      document.open();
      document.write(html);
      document.close();
    } else {
      err.textContent = 'Incorrect password. Please try again.';
      err.classList.add('show');
      document.getElementById('pw').value = '';
      document.getElementById('pw').focus();
    }
  } catch (ex) {
    err.textContent = ex.message;
    err.classList.add('show');
  }
}
</script>
